[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "news-tool"
version = "0.1.0"
description = "RSS collection, event grouping and editorial selection"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "jinja2>=3.1.6,<4",
  "python-multipart>=0.0.20,<1", "sqlalchemy>=2.0.38,<2.1",
  "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2", "pydantic-settings>=2.7,<3",
  "httpx>=0.28,<1", "feedparser>=6.0.11,<7", "beautifulsoup4>=4.13,<5",
  "cryptography>=46.0.5,<47",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires a migrated PostgreSQL database"]
