name: news-tool
x-tiktok: &tiktok
  TIKTOK_ENABLED: ${TIKTOK_ENABLED:-false}
  TIKTOK_DIRECT_POST_ENABLED: ${TIKTOK_DIRECT_POST_ENABLED:-false}
  TIKTOK_REDIRECT_URI: ${TIKTOK_REDIRECT_URI:-}
  TIKTOK_TIMEOUT_SECONDS: ${TIKTOK_TIMEOUT_SECONDS:-60}
x-app: &app
  image: news-tool:local
  build: .
  env_file:
    - path: .env
      required: false
  environment: &env
    DB_HOST: db
    DB_PORT: 5432
    POSTGRES_DB: ${POSTGRES_DB:-news_tool}
    POSTGRES_USER: ${POSTGRES_USER:-news_tool}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-local-password}
    POLL_SECONDS: ${POLL_SECONDS:-3}
    JOB_TIMEOUT_SECONDS: ${JOB_TIMEOUT_SECONDS:-120}
    MAX_ATTEMPTS: ${MAX_ATTEMPTS:-3}
    RETRY_DELAY_SECONDS: ${RETRY_DELAY_SECONDS:-30}
    REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-20}
    MAX_RESPONSE_BYTES: ${MAX_RESPONSE_BYTES:-5242880}
    MAX_ARTICLES_PER_JOB: ${MAX_ARTICLES_PER_JOB:-150}
    RANK_KEYWORDS: ${RANK_KEYWORDS:-}
    ALLOW_PRIVATE_SOURCES: ${ALLOW_PRIVATE_SOURCES:-false}
    LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
    GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
    DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
    GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
    LLM_FALLBACK_PROVIDER: ${LLM_FALLBACK_PROVIDER:-}
    LLM_MAX_CONCURRENCY: ${LLM_MAX_CONCURRENCY:-2}
    LLM_FETCH_ARTICLE: ${LLM_FETCH_ARTICLE:-true}
    ARTICLE_FETCH_TIMEOUT_SECONDS: ${ARTICLE_FETCH_TIMEOUT_SECONDS:-3}
    LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
    LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-8192}
    LLM_ALLOW_FAKE: ${LLM_ALLOW_FAKE:-false}
    MAX_MEDIA_UPLOAD_MB: ${MAX_MEDIA_UPLOAD_MB:-500}
    MEDIA_ROOT: /data
    TTS_URL: http://tts:8000
    TTS_TIMEOUT_SECONDS: ${TTS_TIMEOUT_SECONDS:-900}
  init: true
  restart: unless-stopped
  stop_grace_period: 35s

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-news_tool}
      POSTGRES_USER: ${POSTGRES_USER:-news_tool}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-local-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  web:
    <<: *app
    # Only TikTok OAuth services receive this dedicated secret file.
    env_file:
      - path: .env.tiktok
        required: false
    environment:
      <<: [*env, *tiktok]
      GEMINI_API_KEY: ""
      DEEPSEEK_API_KEY: ""
      GROQ_API_KEY: ""
    command: ["python", "-m", "app.start"]
    ports:
      - "127.0.0.1:${WEB_PORT:-8000}:8000"
    volumes:
      - media_assets:/data/assets
      - media_audio:/data/audio
      - media_video:/data/video
      - media_tmp:/data/tmp
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
  worker:
    <<: *app
    environment:
      <<: *env
      WORKER_ROLE: collect
    env_file:
      - path: script-api-lab/.env
        required: false
      - path: .env
        required: false
      - path: .env.credentials
        required: false
    command: ["python", "-m", "app.worker"]
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker", "--healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
  llm-worker:
    <<: *app
    env_file:
      - path: script-api-lab/.env
        required: false
      - path: .env
        required: false
      - path: .env.credentials
        required: false
    command: ["python", "-m", "app.llm_worker"]
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.llm_worker", "--healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
  tts:
    build:
      context: vendor/VieNeu-TTS
      dockerfile: docker/Dockerfile.cpu
    image: news-tool-vieneu:cpu
    command: ["python", "-m", "apps.openai_speech"]
    environment:
      HF_HOME: /home/app/.cache/huggingface
      PORT: 8000
      VIENEU_BACKEND: onnx
      VIENEU_PRECISION: ${VIENEU_PRECISION:-fp32}
      VIENEU_MAX_STREAMS: 1
      VIENEU_QUEUE: 2
      VIENEU_QUEUE_TIMEOUT: 30
      VIENEU_WATERMARK: 1
    volumes:
      - tts_models:/home/app/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 180s
    restart: unless-stopped
  render-worker:
    <<: *app
    env_file: []
    command: ["python", "-m", "app.render_worker"]
    volumes:
      - media_assets:/data/assets
      - media_audio:/data/audio
      - media_video:/data/video
      - media_tmp:/data/tmp
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_healthy
      tts:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.render_worker", "--healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  publish-worker:
    <<: *app
    env_file:
      - path: .env.tiktok
        required: false
    environment:
      <<: [*env, *tiktok]
    command: ["python", "-m", "app.publish_worker"]
    stop_grace_period: 140s
    volumes:
      - media_video:/data/video:ro
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.publish_worker", "--healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
  tts_models:
  media_assets:
  media_audio:
  media_video:
  media_tmp:
