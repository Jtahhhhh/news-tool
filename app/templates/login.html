<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Login · News Tool</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f5f7;font:16px system-ui;color:#202630}form{width:min(320px,80vw);padding:36px;background:white;border:1px solid #ddd;border-radius:12px}h1{text-align:center;font-size:24px;margin:0 0 28px}label{display:block;margin:18px 0}input,button{box-sizing:border-box;width:100%;padding:12px;margin-top:7px;border:1px solid #aab0bb;border-radius:6px;font:inherit}button{background:#202630;color:white;cursor:pointer}.error{color:#b42318}</style></head>
<body><form method="post" action="/login"><h1>NEWS TOOL</h1>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<input type="hidden" name="csrf_token" value="{{ request.state.csrf_token }}">
<label>Username<input name="username" autocomplete="username" maxlength="254" required autofocus></label>
<label>Password<input name="password" type="password" autocomplete="current-password" maxlength="1024" required></label>
<button type="submit">Login</button></form></body></html>
