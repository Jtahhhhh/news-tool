<div class="script-options"><label>Tên gợi nhớ<input class="form-control" name="name" value="{{ c.name if c else '' }}" required maxlength="100"></label><label>Provider<select class="form-select" name="provider"><option value="gemini">Gemini</option><option value="deepseek" {% if c and c.provider=='deepseek' %}selected{% endif %}>DeepSeek</option></select></label><label>Project / tài khoản<input class="form-control" name="project_id" value="{{ c.project_id if c else '' }}" required maxlength="200"></label></div>
<label>Tên tham chiếu secret — không phải API key<input class="form-control" name="secret_ref" value="{{ c.secret_ref if c else '' }}" placeholder="env:LLM_KEY_GEMINI_A hoặc secret:llm_gemini_a" required maxlength="200" autocomplete="off"></label>
<div class="script-options"><label>Nhóm quota dùng chung<input class="form-control" name="quota_group" value="{{ c.quota_group if c else '' }}" required maxlength="200"></label><label>Model được phép (phân cách dấu phẩy)<input class="form-control" name="allowed_models" value="{{ c.allowed_models|join(', ') if c else '' }}" required></label><label>Mức ưu tiên<input class="form-control" name="priority" type="number" min="0" max="10000" value="{{ c.priority if c else 100 }}"></label></div>
